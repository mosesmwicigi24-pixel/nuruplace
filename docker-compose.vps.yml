# VPS override — used on the production box together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d web
#
# The host nginx terminates TLS and proxies to the container's port, so it is
# published on 127.0.0.1 ONLY. This box is shared with neema-ai (port 3000) and
# bethanyhouse; nothing here should face the internet directly.
#
# THERE IS DELIBERATELY NO `ports:` KEY HERE. Compose merges `ports` lists
# across -f files rather than replacing them, so declaring the mapping again
# with a 127.0.0.1 prefix does not narrow the base file's binding — it adds a
# second one. Docker then publishes the same host port twice, the 0.0.0.0 bind
# takes it, the 127.0.0.1 bind collides, and the whole start is rolled back
# with "address already in use" for a port nothing is using. That failure is
# indistinguishable from a real port conflict and it cost days on this box.
#
# The bind address is set with WEB_BIND in .env instead, which the base file
# reads. It already defaults to 127.0.0.1, so this file need not set anything.
#
# Host port: set WEB_PORT in .env — do not edit this file. Default is 3001
# because neema-ai's web container holds 3000. If a port will not bind, run
# `sudo ./scripts/port-doctor.sh` rather than guessing another number.
#
# The image comes from GHCR, built by .github/workflows/deploy.yml on merge to
# main — the box never builds images itself.
services:
  web:
    image: ghcr.io/mosesmwicigi24-pixel/nuruplace-web:${IMAGE_TAG:-latest}
    # `build` from the base file stays in the merged config, but the box only
    # ever runs `compose pull` + `up -d`, so the pulled image wins and nothing
    # is compiled here. Same arrangement as neema-ai.

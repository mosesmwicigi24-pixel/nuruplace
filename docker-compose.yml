# Base compose. On the VPS this is combined with docker-compose.vps.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Locally, `docker compose up --build` builds from source instead of pulling.

# Pinned rather than derived from the directory name, so the project, network
# and container keep the same identity wherever the checkout lives. On a shared
# box that matters: `docker ps` should say what a container is without anyone
# having to know which directory it was started from.
name: nuruplace

services:
  web:
    build:
      context: .
    image: ghcr.io/mosesmwicigi24-pixel/nuruplace-web:${IMAGE_TAG:-latest}
    container_name: nuruplace_web
    restart: unless-stopped
    environment:
      # Where the connection card delivers. Unset means the form refuses to
      # submit and tells visitors to call instead — it never silently drops.
      CONTACT_WEBHOOK_URL: ${CONTACT_WEBHOOK_URL:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      CONTACT_EMAIL_API: ${CONTACT_EMAIL_API:-}
      CONTACT_EMAIL_KEY: ${CONTACT_EMAIL_KEY:-}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM:-}
      # Giving. Both or neither: the API refuses unsigned gifts, so a URL with
      # no secret is a 401 waiting to happen and /give treats it as unconfigured.
      # Unset, the page says giving is not switched on and points at the
      # mission's funding site — it never accepts a number and does nothing.
      # PATHWAY_GIVING_SECRET must equal the API's WEBSITE_GIVING_WEBHOOK_SECRET.
      PATHWAY_API_URL: ${PATHWAY_API_URL:-}
      PATHWAY_GIVING_SECRET: ${PATHWAY_GIVING_SECRET:-}
    ports:
      # Host port and bind address are both box state, not repo state — set
      # WEB_PORT and WEB_BIND in .env. The container always listens on 3000.
      #
      # The bind address is a VARIABLE rather than something an override file
      # replaces, and that is load-bearing. Compose MERGES `ports` lists across
      # -f files; it does not replace them. A second file declaring
      # "127.0.0.1:3013:3000" on top of this one does not narrow the binding —
      # it adds a second one, and Docker then tries to publish the same port
      # twice. The 0.0.0.0 bind succeeds, the 127.0.0.1 bind collides with it,
      # and the container start is rolled back with:
      #
      #   failed to bind host port 127.0.0.1:3013/tcp: address already in use
      #
      # Which is indistinguishable from a genuinely occupied port: it fails on
      # every port including untried ones, and leaves nothing for ss, lsof or
      # docker-proxy to find, because the start never completed. It cost days
      # here. Declare the port exactly once, in this file, and vary it with
      # variables — never with a second `ports:` in an override.
      #
      # Defaults to loopback: this box is shared and nothing should face the
      # internet except through nginx. Set WEB_BIND=0.0.0.0 to expose it.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3001}:3000"

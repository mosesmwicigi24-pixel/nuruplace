name: Build & Push

# CI builds the image and pushes it to GHCR. It does NOT deploy — the VPS pulls
# the new image itself on a systemd timer (scripts/box-deploy.sh), the same
# arrangement neema-ai uses on the same box and for the same reason: the host
# firewall intermittently drops GitHub-runner IPs on port 22, which makes an
# Actions->box SSH push unreliable. Outbound-from-box pulls are unaffected.
#
# GATED: because the box pulls whatever lands in GHCR:latest, the image push IS
# the deploy. So nothing is built for main until ci.yml is green.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mosesmwicigi24-pixel/nuruplace-web

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The quality gate, reused verbatim so there is exactly one copy of the job
  # definitions.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what the box pulls; the sha tag makes a rollback a
          # one-line IMAGE_TAG change rather than a rebuild.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '`${{ env.IMAGE }}:latest`'
            echo '`${{ env.IMAGE }}:${{ github.sha }}`'
            echo ""
            echo "The box pulls within ~2 minutes. Package must be **public**"
            echo "for anonymous pull — see deploy/README.md."
          } >> "$GITHUB_STEP_SUMMARY"

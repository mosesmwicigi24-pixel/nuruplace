name: CI

# Runs on every push and pull request. Responsiveness and accessibility are
# checked by machine here so nobody has to remember to resize a browser.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  responsive:
    name: Responsive + accessibility (320px → 2560px)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Only Chromium: these tests measure layout and contrast, which do not
      # differ enough between engines to justify tripling the runtime.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves the production output itself,
      # so what is measured is what visitors get.
      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

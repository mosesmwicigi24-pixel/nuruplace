name: CI

# The quality gate. Responsiveness and accessibility are checked by machine
# here so nobody has to remember to resize a browser.
#
# Why no bare `push:` trigger. Between `pull_request` here and deploy.yml
# calling this workflow on main, every commit that can ship is already covered.
# Adding `push` on top fires this workflow TWICE for one commit, and the two
# runs then share a concurrency group and cancel each other — leaving a
# cancelled, red-looking check against a commit that actually passed. Observed
# on 4c00fbb, and previously documented in neema-ai/.github/workflows/deploy.yml
# after the same mistake.
on:
  pull_request:
  # Called by deploy.yml as the gate in front of the GHCR push, so a red suite
  # means no image is ever built for main.
  workflow_call:
  workflow_dispatch:

# Supersede in-flight runs for the same ref. `github.workflow` is part of the
# key on purpose: inside a reusable call it resolves to the CALLER's name
# ("Build & Push"), so a standalone CI run can never cancel the deploy gate.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

      # Compose merges `ports` lists across -f files instead of replacing them,
      # so an override that re-declares a mapping to narrow its bind address
      # yields TWO bindings for one port. Docker then collides with itself and
      # rolls the start back with "address already in use" — on every port,
      # including untried ones, leaving nothing for ss or lsof to find. It cost
      # days on the production box before anyone read the rendered config.
      - name: Compose port bindings
        run: ./scripts/check-compose.sh

      - name: Build
        run: npm run build

  responsive:
    name: Responsive + accessibility (320px → 2560px)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Only Chromium: these tests measure layout and contrast, which do not
      # differ enough between engines to justify tripling the runtime.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves the production output itself,
      # so what is measured is what visitors get.
      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

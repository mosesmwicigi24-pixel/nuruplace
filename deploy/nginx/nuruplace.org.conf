# Host-level nginx server block for nuruplace.org.
#
# This file is NOT applied automatically — the host nginx config lives on the
# box outside any repo. Copy it there and reload:
#
#   sudo cp deploy/nginx/nuruplace.org.conf /etc/nginx/sites-available/nuruplace.org
#   sudo ln -sf /etc/nginx/sites-available/nuruplace.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS lines assume certbot has already issued a certificate:
#   sudo certbot --nginx -d nuruplace.org -d www.nuruplace.org
#
# The current CodeIgniter site is served from another block on this same box.
# Cutover is: DISABLE that block, enable this one, reload. Rollback is the same
# two commands in reverse — keep the old block on disk until you are satisfied.
#
# Disabling the old block is not optional. With both enabled, `nginx -t` still
# passes and only warns:
#
#   [warn] conflicting server name "nuruplace.org" on 0.0.0.0:443, ignored
#
# Whichever block loads first wins and the other is silently ignored, so a
# cutover that only enables this one may change nothing at all — or may flip
# back on the next reload. Verified on nginx 1.24.0.
#
# IPv6: the `listen [::]` lines need an IPv6 stack. If this box has none,
# `nginx -t` fails with `socket() [::]:80 failed (97: Address family not
# supported by protocol)` — delete those three lines rather than debugging it.
# Check with `ip -6 addr`, or see whether the existing site already uses them.

# Must match WEB_PORT in /srv/nuruplace/.env — nginx does not read that file.
# The box currently runs 3013.
#
# Change it HERE, in the repo, and push. Editing the copy under
# /srv/nuruplace/deploy/ on the box does nothing: box-deploy.sh runs
# `git reset --hard origin/main` every two minutes and reverts every tracked
# file. Only /etc/nginx/sites-available/nuruplace.org — the copy outside the
# repo — survives a hand edit, and then it silently disagrees with source.
#
# scripts/check-nginx.sh compares the installed block against .env and says so.
upstream nuruplace_web {
    server 127.0.0.1:3013;
    keepalive 32;
}

# Redirect bare HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name nuruplace.org www.nuruplace.org;
    return 301 https://nuruplace.org$request_uri;
}

# Redirect www to apex, so there is one canonical host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nuruplace.org;

    ssl_certificate     /etc/letsencrypt/live/nuruplace.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuruplace.org/privkey.pem;

    return 301 https://nuruplace.org$request_uri;
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive.
    # This box runs nginx 1.24.0; `http2 on;` did not arrive until 1.25.1 and
    # 1.24 rejects the whole config with `unknown directive "http2"`. The
    # listen form works on both — 1.25+ only warns that it is deprecated.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nuruplace.org;

    ssl_certificate     /etc/letsencrypt/live/nuruplace.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuruplace.org/privkey.pem;

    # Security headers come from next.config.ts so they travel with the app.
    # Only the ones nginx must own live here.
    server_tokens off;

    # Kenyan mobile data is several times European prices, so compression is
    # not a micro-optimisation here. text/javascript matters: it is what modern
    # servers label .js, and an unlisted type ships uncompressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml application/manifest+json;

    client_max_body_size 2m;

    # Next's build output is content-hashed, so it can be cached hard and
    # served without troubling the app server again.
    location /_next/static/ {
        proxy_pass http://nuruplace_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        proxy_pass http://nuruplace_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=604800";
    }

    # Not for the public — the deploy gate hits it on localhost.
    location = /healthz {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://nuruplace_web;
    }

    location / {
        proxy_pass http://nuruplace_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }
}
